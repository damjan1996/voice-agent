# =============================================================================
#  nginx — voice.damjan-savic.com
# =============================================================================
#  Nach außen erreichbar ist genau eines: die Webhooks, die ElevenLabs
#  aufruft. Die n8n-Oberfläche und die Control-API bleiben innen.
#
#  Vor dem Einspielen:
#    1. DNS: A-Record voice.damjan-savic.com auf die Server-IP
#    2. sudo cp deploy/nginx/voice-agent.conf /etc/nginx/sites-available/voice-agent
#    3. sudo ln -s /etc/nginx/sites-available/voice-agent /etc/nginx/sites-enabled/
#    4. sudo certbot --nginx -d voice.damjan-savic.com
#    5. sudo nginx -t && sudo systemctl reload nginx
#
#  Die Ports 5679 (n8n) und 3010 (Control-API) hören nur auf 127.0.0.1 —
#  siehe docker-compose.yml. Was hier nicht durchgereicht wird, ist von
#  außen nicht erreichbar.
# =============================================================================

# ElevenLabs schickt pro Anruf eine Handvoll Aufrufe. Alles darüber ist
# entweder ein Fehler oder jemand, der die Adresse gefunden hat.
limit_req_zone $binary_remote_addr zone=voice_hooks:10m rate=10r/s;

upstream voice_n8n     { server 127.0.0.1:5679; keepalive 8; }
upstream voice_control { server 127.0.0.1:3010; keepalive 4; }

server {
    listen 80;
    listen [::]:80;
    server_name voice.damjan-savic.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voice.damjan-savic.com;

    ssl_certificate     /etc/letsencrypt/live/voice.damjan-savic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.damjan-savic.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header Referrer-Policy           "no-referrer"      always;

    # Post-Call-Nutzlasten mit vollständiger Abschrift können einige
    # Megabyte haben, besonders wenn Audio mitgeschickt wird.
    client_max_body_size 16m;

    access_log /var/log/nginx/voice-agent.access.log;
    error_log  /var/log/nginx/voice-agent.error.log warn;

    # -------------------------------------------------------------------------
    #  Anrufannahme — mit Ausweichweg
    # -------------------------------------------------------------------------
    #  Dieser eine Aufruf entscheidet, ob überhaupt jemand ans Telefon geht.
    #  Antwortet n8n nicht, übernimmt die Control-API direkt. Sie liefert
    #  dieselbe Antwort, nur ohne die Anreicherung aus dem Workflow.
    #
    #  Das ist kein Luxus: ElevenLabs schaltet einen Webhook nach zehn
    #  Fehlversuchen in Folge selbsttätig ab. Ohne Ausweichweg würde eine
    #  halbe Stunde n8n-Wartung den Agent dauerhaft stumm schalten, und
    #  niemand würde es merken, bis sich jemand über die tote Leitung
    #  beschwert.
    location = /webhook/voice/init {
        limit_req zone=voice_hooks burst=20 nodelay;

        proxy_pass http://voice_n8n;
        include /etc/nginx/proxy_params;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        # Kurze Geduld. Der Anrufer hört währenddessen das Freizeichen —
        # nach ein paar Sekunden fragt er sich, ob die Leitung tot ist.
        proxy_connect_timeout 2s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;

        # Der Body wird gepuffert, damit er sich an den Ausweichweg
        # weiterreichen lässt.
        proxy_request_buffering on;

        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @init_ausweich;
    }

    location @init_ausweich {
        internal;
        proxy_pass http://voice_control/intern/init;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;

        # Damit man im Log sieht, dass der Ausweichweg gegriffen hat.
        add_header X-Voice-Ausweich "control-api" always;
    }

    # -------------------------------------------------------------------------
    #  Übrige Webhooks
    # -------------------------------------------------------------------------
    #  Kalender, Termin, Notiz, Nachbereitung. Fällt hier etwas aus, sagt der
    #  Agent das dem Anrufer — unschön, aber kein Grund für einen Ausweichweg
    #  mit halber Funktion.
    location /webhook/voice/ {
        limit_req zone=voice_hooks burst=20 nodelay;

        proxy_pass http://voice_n8n;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout   30s;
        proxy_read_timeout   30s;
    }

    # -------------------------------------------------------------------------
    #  Alles andere
    # -------------------------------------------------------------------------
    #  Die n8n-Oberfläche läuft NICHT über diese Domain. Wer sie braucht,
    #  nimmt einen SSH-Tunnel:
    #
    #      ssh -L 5679:127.0.0.1:5679 damjan@<server>
    #      dann http://127.0.0.1:5679 im Browser
    #
    #  Eine Oberfläche mit vollem Serverzugriff gehört nicht ins offene Netz,
    #  auch nicht mit Passwort.
    location / {
        return 404;
    }
}
